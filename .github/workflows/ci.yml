name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ci_password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate Docker Compose config
        run: docker compose -f docker-compose.yml config

      - name: Validate backup script syntax
        run: bash -n scripts/backup-db.sh

      - name: Shellcheck backup script
        run: shellcheck scripts/backup-db.sh

      - name: Validate nginx config
        run: |
          mkdir -p ssl
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 -keyout ssl/privkey.pem -out ssl/fullchain.pem -subj "/CN=ci.local"
          docker network create ci-net
          docker run -d --name app --network ci-net nginx:alpine
          docker run --rm --network ci-net -v "$PWD/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro" -v "$PWD/ssl:/etc/nginx/ssl:ro" -v "$PWD/html:/var/www/html:ro" nginx:alpine nginx -t
          docker rm -f app
          docker network rm ci-net
